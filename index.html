<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Axe Factor — Reception</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#171f34;        /* brand background */
    --navy-2:#1e2842;       /* raised panels */
    --navy-3:#26314f;       /* borders / hover */
    --teal:#45c3b2;         /* primary */
    --teal-soft:#5fd6c6;    /* lighter teal for text on navy */
    --yellow:#dfdf00;       /* accent */
    --ink:#eef2f8;          /* main text */
    --muted:#8893ad;        /* secondary text */
    --good:#45c3b2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden}
  body{
    background:var(--navy);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Paytone One',sans-serif;font-weight:400;letter-spacing:.01em}

  /* faint target motif bleeding off the right edge */
  .motif{
    position:fixed;right:-12vh;top:50%;transform:translateY(-50%);
    width:78vh;height:78vh;border-radius:50%;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle, transparent 0 8%, var(--teal) 8% 13%, transparent 13% 22%,
      var(--teal) 22% 27%, transparent 27% 38%, var(--teal) 38% 43%, transparent 43%);
    opacity:.05;
  }

  .stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:3.2vh 3.6vw 0}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:1.6vw}
  .brand img{height:9.5vh;width:auto;display:block}
  .brand .names{line-height:1}
  .brand .names .top{font-family:'Paytone One',sans-serif;font-size:3.0vh;color:var(--ink)}
  .brand .names .sub{font-size:1.5vh;color:var(--teal-soft);letter-spacing:.22em;text-transform:uppercase;margin-top:.7vh;font-weight:700}

  .clockwrap{text-align:right;line-height:1}
  .clock{font-family:'Paytone One',sans-serif;font-size:5.2vh;color:var(--ink)}
  .date{font-size:1.8vh;color:var(--muted);margin-top:.6vh;font-weight:600;letter-spacing:.04em}
  .livedot{display:inline-flex;align-items:center;gap:.6vw;margin-top:1vh;font-size:1.4vh;font-weight:700;letter-spacing:.14em;color:var(--teal-soft);text-transform:uppercase}
  .livedot .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 var(--teal);animation:pulse 2s infinite}
  .livedot.stale .dot{background:var(--yellow);animation:none}
  .livedot.stale{color:var(--yellow)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(69,195,178,.6)}70%{box-shadow:0 0 0 1.4vh rgba(69,195,178,0)}100%{box-shadow:0 0 0 0 rgba(69,195,178,0)}}

  /* ---- main grid ---- */
  .main{flex:1 1 auto;display:grid;grid-template-columns:1.35fr 1fr;gap:3vw;align-items:stretch;padding:3.4vh 0}

  /* next session hero */
  .hero{
    background:linear-gradient(160deg,var(--navy-2),var(--navy));
    border:1px solid var(--navy-3);border-radius:2.4vh;
    padding:4vh 3.2vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.8vh;background:var(--teal)}
  .eyebrow{font-size:1.7vh;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--teal-soft)}
  .hero .when{font-family:'Paytone One',sans-serif;font-size:11vh;line-height:.92;color:var(--ink);margin-top:1.4vh}
  .hero .whenmeta{font-size:2.6vh;font-weight:700;color:var(--ink);margin-top:1.2vh}
  .hero .spaces{display:inline-flex;align-items:baseline;gap:.6vw;margin-top:3vh;
    background:var(--teal);color:var(--navy);font-weight:800;border-radius:1.2vh;padding:1.4vh 2vw;font-size:2.6vh}
  .hero .spaces b{font-family:'Paytone One',sans-serif;font-size:3.4vh;font-weight:400}
  .hero .soldout{margin-top:3vh;display:inline-block;background:var(--navy-3);color:var(--muted);font-weight:700;border-radius:1.2vh;padding:1.4vh 2vw;font-size:2.4vh}
  .hero .cta{margin-top:auto;padding-top:3vh;font-size:2vh;color:var(--muted);font-weight:600}
  .hero .cta b{color:var(--yellow)}
  .herofill{display:flex;align-items:center;gap:1.8vw;margin-top:3.6vh}
  .herofill svg{width:9vh;height:9vh;opacity:.9;flex:0 0 auto}
  .herofill .venue{font-size:2.1vh;font-weight:700;color:var(--ink);line-height:1.4}
  .herofill .venue span{font-size:1.7vh;font-weight:500;color:var(--muted)}

  /* upcoming list */
  .upcoming{display:flex;flex-direction:column}
  .upcoming h3{font-size:1.9vh;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2vh;font-family:'Inter',sans-serif}
  .slots{display:flex;flex-direction:column;gap:1.4vh;flex:1 1 auto}
  .slot{display:flex;align-items:center;justify-content:space-between;
    background:var(--navy-2);border:1px solid var(--navy-3);border-radius:1.4vh;padding:2.1vh 1.8vw}
  .slot .t{font-family:'Paytone One',sans-serif;font-size:3.4vh;color:var(--ink);min-width:7vw}
  .slot .d{font-size:1.6vh;color:var(--muted);font-weight:600;margin-top:.4vh}
  .slot .left{display:flex;flex-direction:column}
  .pill{font-size:1.7vh;font-weight:800;padding:.9vh 1.4vw;border-radius:.9vh;letter-spacing:.03em;white-space:nowrap}
  .pill.open{background:rgba(69,195,178,.16);color:var(--teal-soft);border:1px solid rgba(69,195,178,.4)}
  .pill.few{background:rgba(223,223,0,.14);color:var(--yellow);border:1px solid rgba(223,223,0,.4)}
  .pill.full{background:var(--navy-3);color:var(--muted);border:1px solid var(--navy-3)}
  .empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2.2vh;text-align:center;font-weight:600;border:1px dashed var(--navy-3);border-radius:1.4vh}

  /* ---- ticker ---- */
  .ticker{flex:0 0 auto;background:var(--teal);color:var(--navy);overflow:hidden;white-space:nowrap;height:6.4vh;display:flex;align-items:center;margin:0 -3.6vw}
  .ticker .track{display:inline-block;padding-left:100%;animation:scroll 38s linear infinite;font-weight:800;font-size:2.2vh;letter-spacing:.02em}
  .ticker .track span{margin:0 3vw}
  .ticker .track .sep{color:var(--navy);opacity:.45}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--navy);z-index:5;font-size:2.4vh;color:var(--muted);font-weight:600}

  @media (prefers-reduced-motion: reduce){
    .ticker .track{animation:none}
    .livedot .dot{animation:none}
  }
</style>
</head>

<script>
const FEED = "/api/tv-feed";
const TZ = "Europe/London";

const fmtTime = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const fmtDay  = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"long"});
const fmtDate = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});

// Returns Y-M-D string in UK time for grouping "today"
function ukDateKey(d){
  return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}

function tickClock(){
  const now=new Date();
  document.getElementById("clock").textContent=fmtTime.format(now);
  document.getElementById("date").textContent=fmtDate.format(now);
}
setInterval(tickClock,1000); tickClock();

function relativeDayLabel(d){
  const todayKey=ukDateKey(new Date());
  const tom=new Date(Date.now()+86400000);
  const k=ukDateKey(d);
  if(k===todayKey) return "Today";
  if(k===ukDateKey(tom)) return "Tomorrow";
  return fmtDay.format(d);
}

function render(data){
  document.getElementById("loading").style.display="none";

  const live=document.getElementById("livedot");
  if(data.stale){ live.classList.add("stale"); document.getElementById("livetext").textContent="Last known"; }
  else { live.classList.remove("stale"); document.getElementById("livetext").textContent="Live"; }

  const now=new Date();
  const events=(data.events||[]).map(e=>({...e,startD:new Date(e.start)}));

  // Future, open (not blocked) sessions
  const future=events.filter(e=>e.startD>now && e.isOpen);

  // ---- HERO: next bookable session ----
  const next=future.find(e=>e.available>0);
  const heroWhen=document.getElementById("heroWhen");
  const heroMeta=document.getElementById("heroMeta");
  const heroSpaces=document.getElementById("heroSpaces");

  if(next){
    heroWhen.textContent=fmtTime.format(next.startD);
    heroMeta.textContent=relativeDayLabel(next.startD)+" · 1 hour session";
    const s=next.available;
    heroSpaces.className="";
    heroSpaces.innerHTML='<div class="spaces"><b>'+s+'</b> '+(s===1?'space left':'spaces left')+'</div>';
  } else {
    // nothing bookable in the feed window
    const nextBooked=future[0];
    if(nextBooked){
      heroWhen.textContent=fmtTime.format(nextBooked.startD);
      heroMeta.textContent=relativeDayLabel(nextBooked.startD)+" · 1 hour session";
      heroSpaces.innerHTML='<div class="soldout">Fully booked — ask about cancellations</div>';
    } else {
      heroWhen.textContent="—";
      heroMeta.textContent="No sessions scheduled";
      heroSpaces.innerHTML='<div class="soldout">Ask a team member for availability</div>';
    }
  }

  // ---- UPCOMING: next several open sessions ----
  const slotsEl=document.getElementById("slots");
  slotsEl.innerHTML="";
  const list=future.slice(0,5);
  if(list.length===0){
    slotsEl.innerHTML='<div class="empty">No more sessions in the schedule right now —<br>speak to a team member to get throwing.</div>';
  } else {
    for(const e of list){
      let pillCls="full",pillTxt="Fully booked";
      if(e.available>2){pillCls="open";pillTxt=e.available+" spaces";}
      else if(e.available>0){pillCls="few";pillTxt=e.available+" left";}
      const row=document.createElement("div");
      row.className="slot";
      row.innerHTML=
        '<div class="left"><span class="t">'+fmtTime.format(e.startD)+'</span>'+
        '<span class="d">'+relativeDayLabel(e.startD)+'</span></div>'+
        '<span class="pill '+pillCls+'">'+pillTxt+'</span>';
      slotsEl.appendChild(row);
    }
  }

  // ---- TICKER ----
  const tk=document.getElementById("ticker");
  const lines=[
    "WELCOME TO THE AXE FACTOR",
    "WALK-INS WELCOME — SUBJECT TO AVAILABILITY",
    "YOUR OWN CHAMPTHROW LANE · UP TO 8 THROWERS · OVER 15 DIGITAL GAMES",
    "BIRTHDAYS · STAG & HEN · TEAM BUILDING — ASK A TEAM MEMBER",
    "CAFÉ ONSITE · CLOSED-TOE SHOES REQUIRED · OVER 8s WELCOME",
    "BOOK ONLINE AT THEAXEFACTOR.CO.UK"
  ];
  tk.innerHTML=lines.map(l=>'<span>'+l+'</span>').join('<span class="sep">◆</span>');
}

async function load(){
  try{
    const r=await fetch(FEED,{cache:"no-store"});
    const data=await r.json();
    render(data);
  }catch(err){
    document.getElementById("loading").textContent="Reconnecting…";
    console.error(err);
  }
}
load();
setInterval(load,2*60*1000); // refresh every 2 minutes

// preview helper: ?demo=1 injects fake data without the API
if(new URLSearchParams(location.search).get("demo")==="1"){
  const base=Date.now();
